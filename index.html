<!DOCTYPE html>
<html>
<head>
    <title>Aging Report</title>

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- AutoTable Plugin -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .container {
            background: white;
            width: 95%;
            max-width: 1100px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #2a5298;
            color: white;
        }

        th, td {
            padding: 12px;
            text-align: center;
        }

        tbody tr:nth-child(even) {
            background: #f4f6fa;
        }

        input {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
        }

        .button-group {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            margin: 5px;
            transition: 0.3s;
        }

        .add-btn { background: #28a745; color: white; }
        .pdf-btn { background: #007bff; color: white; }
        .clear-btn { background: #6c757d; color: white; }
        .remove-btn { background: #dc3545; color: white; padding: 6px 10px; border-radius: 6px; }

        button:hover { opacity: 0.85; }
    </style>
</head>

<body>

<div class="container">
    <h2 id="reportTitle"></h2>

    <table id="itemTable">
        <thead>
            <tr>
                <th>Item Code</th>
                <th>Item Name</th>
                <th>Quantity</th>
                <th>MPD</th>
                <th>EXD</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><input type="text"></td>
                <td><input type="text"></td>
                <td><input type="number"></td>
                <td><input type="date"></td>
                <td><input type="date"></td>
                <td><button type="button" class="remove-btn" onclick="removeRow(this)">Remove</button></td>
            </tr>
        </tbody>
    </table>

    <div class="button-group">
        <button class="add-btn" onclick="addRow()">Add New Item</button>
        <button class="pdf-btn" onclick="generatePDF()">Download PDF</button>
        <button class="clear-btn" onclick="clearSavedData()">Clear Saved Data</button>
    </div>
</div>

<script>
    const today = new Date().toISOString().split('T')[0];
    document.getElementById("reportTitle").innerText = "Aging Report [" + today + "]";

    // Load saved data
    window.onload = function () {
        const saved = localStorage.getItem("agingReportData");
        if (saved) {
            document.querySelector("#itemTable tbody").innerHTML = saved;
        }
        attachListeners();
    };

    function addRow() {
        const table = document.querySelector("#itemTable tbody");
        const newRow = table.rows[0].cloneNode(true);
        newRow.querySelectorAll("input").forEach(input => input.value = "");
        table.appendChild(newRow);
        attachListeners();
        saveData();
    }

    function removeRow(button) {
        const table = document.querySelector("#itemTable tbody");
        if (table.rows.length > 1) {
            button.closest("tr").remove();
            saveData();
        } else {
            alert("At least one row required.");
        }
    }

    function attachListeners() {
        document.querySelectorAll("#itemTable input").forEach(input => {
            input.oninput = saveData;
        });
    }

    function saveData() {
        const tableData = document.querySelector("#itemTable tbody").innerHTML;
        localStorage.setItem("agingReportData", tableData);
    }

    function clearSavedData() {
        if (confirm("Clear all saved data?")) {
            localStorage.removeItem("agingReportData");
            location.reload();
        }
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        doc.setFontSize(16);
        doc.text("Aging Report [" + today + "]", 14, 20);

        const tableColumn = ["Item Code", "Item Name", "Quantity", "MPD", "EXD"];
        const tableRows = [];

        document.querySelectorAll("#itemTable tbody tr").forEach(row => {
            const inputs = row.querySelectorAll("input");
            tableRows.push([
                inputs[0].value || "-",
                inputs[1].value || "-",
                inputs[2].value || "-",
                inputs[3].value || "-",
                inputs[4].value || "-"
            ]);
        });

        doc.autoTable({
            head: [tableColumn],
            body: tableRows,
            startY: 30,
            theme: "grid",
            styles: {
                fontSize: 10,
                halign: "center"
            },
            headStyles: {
                fillColor: [42, 82, 152],
                textColor: 255,
                fontStyle: "bold"
            },
            alternateRowStyles: {
                fillColor: [240, 240, 240]
            }
        });

        doc.save("Aging_Report_" + today + ".pdf");
    }
</script>

</body>
</html>
